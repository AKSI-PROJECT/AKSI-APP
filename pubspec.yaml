name: aksi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  google_mlkit_document_scanner: ^0.5.0
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_face_detection: ^0.14.0
  google_mlkit_barcode_scanning: ^0.15.0
  pdf: ^3.11.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  image: ^4.1.7
  http: ^1.6.0
  url_launcher: ^6.3.2
  file_picker: ^8.0.7
  shared_preferences: ^2.5.5
  path: ^1.9.1
  google_fonts: ^8.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/logo_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/images/
